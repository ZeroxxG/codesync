[project]
name = "codesync-runner"
version = "0.1.0"
description = "CodeSync sandboxed execution runner worker"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0,<5.5.0",
    "redis>=5.0.0,<5.3.0",
    "docker>=7.1.0,<7.2.0",
    "requests>=2.31.0,<2.33.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
