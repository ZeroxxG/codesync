# Production overrides for Azure deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d

services:
  # Local postgres container is disabled; using Azure Database for PostgreSQL Flexible Server
  postgres:
    profiles:
      - disabled

  # Frontend container is disabled; hosted externally on Vercel
  web:
    profiles:
      - disabled

  api:
    profiles:
      - prod
    restart: always
    ports: !override []
    volumes: !override []
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-codesync}
      POSTGRES_USER: ${POSTGRES_USER:-codesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://api:8000
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://codesyncapp.duckdns.org}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://codesyncapp.duckdns.org,https://*.vercel.app}
    depends_on: !override
      redis:
        condition: service_healthy

  realtime-1:
    profiles:
      - prod
    restart: always
    volumes: !override []
    environment:
      PORT: 1234
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://api:8000
    depends_on:
      redis:
        condition: service_healthy

  realtime-2:
    profiles:
      - prod
    restart: always
    volumes: !override []
    environment:
      PORT: 1234
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://api:8000
    depends_on:
      redis:
        condition: service_healthy

  runner:
    build: ./apps/runner
    profiles:
      - prod
    restart: always
    env_file: !override []
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-10}
      MEMORY_LIMIT: ${MEMORY_LIMIT:-128m}
      MEMSWAP_LIMIT: ${MEMSWAP_LIMIT:-128m}
      NANO_CPUS: ${NANO_CPUS:-500000000}
      PIDS_LIMIT: ${PIDS_LIMIT:-64}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-65536}
      SANDBOX_IMAGE_PYTHON: ${SANDBOX_IMAGE_PYTHON:-codesync-sandbox-python:latest}
      SANDBOX_IMAGE_JAVASCRIPT: ${SANDBOX_IMAGE_JAVASCRIPT:-codesync-sandbox-javascript:latest}
      SANDBOX_IMAGE_CPP: ${SANDBOX_IMAGE_CPP:-codesync-sandbox-cpp:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

  redis:
    profiles:
      - prod
    restart: always
    ports: !override
      - "127.0.0.1:6379:6379"

  nginx:
    profiles:
      - prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "1234:1234"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - realtime-1
      - realtime-2
